# Amagi config for its own repo: dogfood the backlog under the "am" bd prefix.
# See README.md#configuration for the full schema; `amagi config` prints the
# resolved result and where each value came from.

[repo]
baseBranch = "main"
setupCmd = "bun install"
persona = "agent-chise"

[tracker]
kind = "beads"

[forge]
kind = "github"
remote = "origin"

[checks]
commands = ["just check"]
