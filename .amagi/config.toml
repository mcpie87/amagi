[repo]
baseBranch = "main"
setupCmd = "bun install"
persona = "agent-chise"

[tracker]
kind = "beads"

[forge]
kind = "github"
remote = "origin"

[checks]
format = "just fmt"
lint = "just lint"
test = "just test"
commands = [ "just check", "just fresh-check" ]

[loop]
maxParallel = 1
autoQueue = true

[notify]
ntfyServer = "https://ntfy.sh"
ntfyTopic = "amagi-chise"
